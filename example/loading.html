<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/loading.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<span class="loading loading-spinner"></span>
		<span class="loading loading-dots"></span>
		<span class="loading loading-ring"></span>
		<span class="loading loading-ball"></span>
		<span class="loading loading-bars"></span>
		<span class="loading loading-infinity"></span>
	</div>

	<div class="preview">
		<span class="loading loading-spinner loading-xs"></span>
		<span class="loading loading-spinner loading-sm"></span>
		<span class="loading loading-spinner"></span>
		<span class="loading loading-spinner loading-md"></span>
		<span class="loading loading-spinner loading-lg"></span>
		<span class="loading loading-spinner loading-xl"></span>
	</div>

	<div class="preview">
		<span class="loading loading-spinner" style="color:var(--color-primary)"></span>
		<span class="loading loading-spinner" style="color:var(--color-secondary)"></span>
		<span class="loading loading-spinner" style="color:var(--color-accent)"></span>
		<span class="loading loading-spinner" style="color:var(--color-success)"></span>
		<span class="loading loading-spinner" style="color:var(--color-warning)"></span>
		<span class="loading loading-spinner" style="color:var(--color-error)"></span>
	</div>

</body>
</html>
