<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/badge.css">
	<link rel="stylesheet" href="../css/components/chip.css">
	<link rel="stylesheet" href="../css/components/button.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<div class="badge">
			<button class="btn">Inbox</button>
			<span class="chip chip-primary chip-xs">4</span>
		</div>
	</div>

	<div class="preview">
		<div class="badge indicator-top indicator-end">
			<button class="btn">Notifications</button>
			<span class="chip chip-error chip-xs">99+</span>
		</div>
	</div>

	<div class="preview">
		<div class="badge indicator-top indicator-start">
			<button class="btn btn-primary">Start</button>
			<span class="chip chip-secondary chip-xs">new</span>
		</div>
		<div class="badge indicator-top indicator-center">
			<button class="btn">Center</button>
			<span class="chip chip-accent chip-xs">!</span>
		</div>
		<div class="badge indicator-top indicator-end">
			<button class="btn">End</button>
			<span class="chip chip-neutral chip-xs">3</span>
		</div>
	</div>

	<div class="preview">
		<div class="badge indicator-bottom indicator-end">
			<button class="btn">Bottom</button>
			<span class="chip chip-success chip-xs">✓</span>
		</div>
		<div class="badge indicator-middle indicator-end">
			<button class="btn">Middle</button>
			<span class="chip chip-warning chip-xs">⚠</span>
		</div>
	</div>

</body>
</html>
