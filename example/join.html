<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/join.css">
	<link rel="stylesheet" href="../css/components/button.css">
	<link rel="stylesheet" href="../css/components/input.css">
	<link rel="stylesheet" href="../css/components/select.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<div class="join">
			<button class="btn join-item">Left</button>
			<button class="btn join-item btn-primary">Center</button>
			<button class="btn join-item">Right</button>
		</div>
	</div>

	<div class="preview">
		<div class="join">
			<input type="text" class="input join-item" placeholder="Search…" />
			<button class="btn btn-primary join-item">Go</button>
		</div>
	</div>

	<div class="preview">
		<div class="join">
			<select class="select join-item">
				<option>Type</option>
				<option>Image</option>
				<option>Video</option>
			</select>
			<input type="text" class="input join-item" placeholder="Keyword" />
			<button class="btn join-item">Search</button>
		</div>
	</div>

	<div class="preview">
		<div class="join join-vertical">
			<button class="btn join-item">Top</button>
			<button class="btn join-item btn-primary">Middle</button>
			<button class="btn join-item">Bottom</button>
		</div>
	</div>

	<div class="preview">
		<div class="join">
			<button class="btn join-item btn-xs">xs</button>
			<button class="btn join-item btn-xs btn-primary">xs</button>
			<button class="btn join-item btn-xs">xs</button>
		</div>
		<div class="join">
			<button class="btn join-item btn-sm">sm</button>
			<button class="btn join-item btn-sm btn-primary">sm</button>
			<button class="btn join-item btn-sm">sm</button>
		</div>
		<div class="join">
			<button class="btn join-item btn-lg">lg</button>
			<button class="btn join-item btn-lg btn-primary">lg</button>
			<button class="btn join-item btn-lg">lg</button>
		</div>
	</div>

	<div class="preview">
		<div class="join">
			<input type="text" class="input input-sm join-item" placeholder="Search…" />
			<button class="btn btn-primary btn-sm join-item">Go</button>
		</div>
		<div class="join">
			<input type="text" class="input join-item" placeholder="Search…" />
			<button class="btn btn-primary join-item">Go</button>
		</div>
		<div class="join">
			<input type="text" class="input input-lg join-item" placeholder="Search…" />
			<button class="btn btn-primary btn-lg join-item">Go</button>
		</div>
	</div>

</body>
</html>
