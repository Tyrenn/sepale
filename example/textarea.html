<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/textarea.css">
	<link rel="stylesheet" href="../css/components/label.css">
	<link rel="stylesheet" href="../css/components/fieldset.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<textarea class="textarea" placeholder="Default textarea"></textarea>
	</div>

	<div class="preview">
		<textarea class="textarea textarea-xs" placeholder="xs"></textarea>
		<textarea class="textarea textarea-sm" placeholder="sm"></textarea>
		<textarea class="textarea textarea-md" placeholder="md"></textarea>
		<textarea class="textarea textarea-lg" placeholder="lg"></textarea>
	</div>

	<div class="preview">
		<textarea class="textarea textarea-primary"   placeholder="Primary"></textarea>
		<textarea class="textarea textarea-secondary" placeholder="Secondary"></textarea>
		<textarea class="textarea textarea-accent"    placeholder="Accent"></textarea>
		<textarea class="textarea textarea-success"   placeholder="Success"></textarea>
		<textarea class="textarea textarea-warning"   placeholder="Warning"></textarea>
		<textarea class="textarea textarea-error"     placeholder="Error"></textarea>
	</div>

	<div class="preview">
		<textarea class="textarea textarea-ghost" placeholder="Ghost"></textarea>
	</div>

	<div class="preview">
		<label class="floating-label">
			<textarea class="textarea" placeholder="Message"></textarea>
			<span>Message</span>
		</label>
	</div>

	<div class="preview">
		<textarea class="textarea" placeholder="Disabled" disabled></textarea>
	</div>

</body>
</html>
