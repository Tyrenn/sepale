<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/toggle.css">
	<link rel="stylesheet" href="../css/components/label.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<input type="checkbox" class="toggle" />
		<input type="checkbox" class="toggle" checked />
	</div>

	<div class="preview">
		<label class="label">
			<input type="checkbox" class="toggle toggle-primary" checked />
			Notifications
		</label>
	</div>

	<div class="preview">
		<input type="checkbox" class="toggle toggle-primary"   checked />
		<input type="checkbox" class="toggle toggle-secondary" checked />
		<input type="checkbox" class="toggle toggle-accent"    checked />
		<input type="checkbox" class="toggle toggle-neutral"   checked />
		<input type="checkbox" class="toggle toggle-info"      checked />
		<input type="checkbox" class="toggle toggle-success"   checked />
		<input type="checkbox" class="toggle toggle-warning"   checked />
		<input type="checkbox" class="toggle toggle-error"     checked />
	</div>

	<div class="preview">
		<input type="checkbox" class="toggle toggle-xs" checked />
		<input type="checkbox" class="toggle toggle-sm" checked />
		<input type="checkbox" class="toggle" checked />
		<input type="checkbox" class="toggle toggle-md" checked />
		<input type="checkbox" class="toggle toggle-lg" checked />
		<input type="checkbox" class="toggle toggle-xl" checked />
	</div>

	<div class="preview">
		<input type="checkbox" class="toggle" disabled />
		<input type="checkbox" class="toggle" disabled checked />
	</div>

	<div class="preview">
		<input type="checkbox" class="toggle toggle-track" checked />
		<input type="checkbox" class="toggle toggle-track toggle-primary"   checked />
		<input type="checkbox" class="toggle toggle-track toggle-secondary" checked />
		<input type="checkbox" class="toggle toggle-track toggle-accent"    checked />
		<input type="checkbox" class="toggle toggle-track toggle-success"   checked />
		<input type="checkbox" class="toggle toggle-track toggle-warning"   checked />
		<input type="checkbox" class="toggle toggle-track toggle-error"     checked />
	</div>

	<div class="preview">
		<input type="checkbox" class="toggle toggle-track toggle-primary" />
		<input type="checkbox" class="toggle toggle-track toggle-primary" checked />
	</div>

</body>
</html>
