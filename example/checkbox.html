<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/checkbox.css">
	<link rel="stylesheet" href="../css/components/fieldset.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>

<body>

	<div class="preview">
		<input type="checkbox" checked="checked" class="checkbox" />
	</div>

	<div class="preview">
		<fieldset class="fieldset">
			<legend class="fieldset-legend">Login options</legend>
			<label class="label">
				<input type="checkbox" checked="checked" class="checkbox" />
				Remember me
			</label>
		</fieldset>
	</div>

	<div class="preview">
		<input type="checkbox" checked="checked" class="checkbox checkbox-xs" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-sm" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-md" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-lg" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-xl" />
	</div>

	<div class="preview">
		<input type="checkbox" checked="checked" class="checkbox checkbox-primary" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-secondary" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-accent" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-neutral" />

		<input type="checkbox" checked="checked" class="checkbox checkbox-info" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-success" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-warning" />
		<input type="checkbox" checked="checked" class="checkbox checkbox-error" />
	</div>

	<div class="preview">
		<input type="checkbox" class="checkbox" disabled />
		<input type="checkbox" class="checkbox" disabled checked="checked" />
	</div>

	<div class="preview">
		<input type="checkbox" class="checkbox" id="my-checkbox" indeterminate="true"/>
	</div>

	<div class="preview">
		<input
			type="checkbox"
			checked="checked"
			class="checkbox border-indigo-600 bg-indigo-500 checked:border-orange-500 checked:bg-orange-400 checked:text-orange-800"
		/>
	</div>

	<div class="preview">

	</div>
	
	<div class="preview">
	</div>
	
	<div class="preview">

	</div>

	<div class="preview">

	</div>

</body>


</html>
