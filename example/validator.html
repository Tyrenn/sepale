<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/input.css">
	<link rel="stylesheet" href="../css/components/textarea.css">
	<link rel="stylesheet" href="../css/components/checkbox.css">
	<link rel="stylesheet" href="../css/components/label.css">
	<link rel="stylesheet" href="../css/components/fieldset.css">
	<link rel="stylesheet" href="../css/components/validator.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview" style="flex-direction:column; align-items:center; gap:1rem;">
		<fieldset class="fieldset" style="width:20rem;">
			<legend class="fieldset-legend">Email</legend>
			<input type="email" required class="input validator" placeholder="name@example.com" />
			<p class="validator-hint">Enter a valid email address</p>
		</fieldset>

		<fieldset class="fieldset" style="width:20rem;">
			<legend class="fieldset-legend">Required field</legend>
			<input type="text" required minlength="3" class="input validator" placeholder="Min 3 chars" />
			<p class="validator-hint">At least 3 characters required</p>
		</fieldset>

		<fieldset class="fieldset" style="width:20rem;">
			<legend class="fieldset-legend">Message</legend>
			<textarea required class="textarea validator" placeholder="Write something…"></textarea>
			<p class="validator-hint">Field is required</p>
		</fieldset>

		<fieldset class="fieldset" style="width:20rem;">
			<legend class="fieldset-legend">Agreement</legend>
			<label class="label">
				<input type="checkbox" required class="checkbox validator" />
				I agree to the terms
			</label>
			<p class="validator-hint">You must agree to continue</p>
		</fieldset>
	</div>

</body>
</html>
