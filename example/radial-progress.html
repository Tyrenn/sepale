<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/radial-progress.css">
	<link rel="stylesheet" href="../css/components/text.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<div class="radial-progress" style="--value:0">0%</div>
		<div class="radial-progress" style="--value:25">25%</div>
		<div class="radial-progress" style="--value:50">50%</div>
		<div class="radial-progress" style="--value:75">75%</div>
		<div class="radial-progress" style="--value:100">100%</div>
	</div>

	<div class="preview">
		<div class="radial-progress radial-progress-xs" style="--value:70; color:var(--color-primary)">70%</div>
		<div class="radial-progress radial-progress-sm" style="--value:70; color:var(--color-secondary)">70%</div>
		<div class="radial-progress" style="--value:70; color:var(--color-accent)">70%</div>
		<div class="radial-progress radial-progress-md" style="--value:70; color:var(--color-success)">70%</div>
		<div class="radial-progress radial-progress-lg" style="--value:70; color:var(--color-warning)">70%</div>
		<div class="radial-progress radial-progress-xl" style="--value:70; color:var(--color-error)">70%</div>
	</div>

	<div class="preview">
		<div class="radial-progress" style="--value:70; --thickness:2px">2px</div>
		<div class="radial-progress" style="--value:70; --thickness:8px">8px</div>
		<div class="radial-progress" style="--value:70; --thickness:1rem">1rem</div>
	</div>

</body>
</html>
