<!DOCTYPE html>
<html>
<head>
	<script>!function(){var t=localStorage.getItem('uu-theme')||'coffee';document.write('<link rel="stylesheet" href="../theme/'+t+'.css" data-theme>')}();</script>
	<link rel="stylesheet" href="../css/base/properties.css">
	<link rel="stylesheet" href="../css/base/svg.css">
	<link rel="stylesheet" href="../css/base/reset.css">
	<link rel="stylesheet" href="../css/base/rootcolor.css">
	<link rel="stylesheet" href="../css/base/scrollbar.css">
	<link rel="stylesheet" href="../css/base/default.css">
	<link rel="stylesheet" href="../css/components/file-input.css">
	<link rel="stylesheet" href="../css/components/label.css">
	<link rel="stylesheet" href="../css/components/fieldset.css">
	<link rel="stylesheet" href="./preview.css">
	<script src="./preview.js" defer></script>
</head>
<body>

	<div class="preview">
		<input type="file" class="file-input" />
	</div>

	<div class="preview">
		<input type="file" class="file-input file-input-xs" />
		<input type="file" class="file-input file-input-sm" />
		<input type="file" class="file-input" />
		<input type="file" class="file-input file-input-md" />
		<input type="file" class="file-input file-input-lg" />
	</div>

	<div class="preview">
		<input type="file" class="file-input file-input-primary"   />
		<input type="file" class="file-input file-input-secondary" />
		<input type="file" class="file-input file-input-accent"    />
		<input type="file" class="file-input file-input-neutral"   />
	</div>

	<div class="preview">
		<input type="file" class="file-input file-input-info"    />
		<input type="file" class="file-input file-input-success" />
		<input type="file" class="file-input file-input-warning" />
		<input type="file" class="file-input file-input-error"   />
	</div>

	<div class="preview">
		<input type="file" class="file-input file-input-ghost" />
	</div>

	<div class="preview">
		<fieldset class="fieldset">
			<legend class="fieldset-legend">Upload avatar</legend>
			<input type="file" class="file-input" accept="image/*" />
		</fieldset>
	</div>

	<div class="preview">
		<input type="file" class="file-input" disabled />
	</div>

</body>
</html>
